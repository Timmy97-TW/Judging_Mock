<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judging mock question bank · ReLeaf</title>
<meta name="description" content="Mock judging question bank for ReLeaf, GEMS Taiwan iGEM 2026: fact, decision, boundary, alternative and weakness probes across eight areas, in English and Traditional Chinese.">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
</head>
<body data-lang="en">

<div class="bar">
  <div class="bar-in">
    <span class="mark">
      <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 4C9 4 4 9.5 4 15.5c0 2 .6 3.5.6 3.5"/><path d="M20 4c0 9-5.5 13-15 14.5"/></svg>
      ReLeaf <span class="sub">GEMS Taiwan · iGEM 2026</span>
    </span>
    <span class="bar-spacer"></span>
    <button class="ghost" id="drill-open">Drill</button>
    <div class="seg" id="lang" role="group" aria-label="Language">
      <span class="thumb"></span>
      <button data-lang="en" aria-pressed="true">English</button>
      <button data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>
</div>

<a id="top"></a>

<header class="wrap hero">
  <div class="eyebrow">Judging rehearsal</div>
  <h1>Question bank</h1>
  <p class="lede"></p>
  <div class="hero-meta">
    <div><b id="m-q">0</b><span>questions</span></div>
    <div><b id="m-s">0</b><span>sections</span></div>
    <div><b id="m-t">5</b><span>question types</span></div>
  </div>
  <div class="keys" id="keys"></div>
</header>

<div class="tools">
  <div class="tools-in">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="search" type="search" autocomplete="off" placeholder="Search">
    </label>
    <div class="chips" id="chips"></div>
    <span class="count" id="count"></span>
    <span class="count" id="progress"></span>
    <button class="ghost" id="toggle-all">Open all</button>
  </div>
</div>

<div class="wrap main">
  <nav class="rail" id="rail"></nav>
  <div id="sections"></div>
</div>

<footer class="wrap foot" id="foot"></footer>

<div class="drill" id="drill" data-on="0" data-reveal="0">
  <div class="drill-bar">
    <span class="count"></span>
    <button class="ghost" id="drill-shuffle">Shuffle</button>
    <button class="ghost" id="drill-exit">Exit</button>
  </div>
  <div class="drill-stage"></div>
  <div class="drill-hint"></div>
  <div class="drill-foot">
    <button class="ghost" id="drill-prev">Back</button>
    <button class="solid" id="drill-reveal">Show answer</button>
    <button class="ghost" id="drill-next">Next</button>
  </div>
</div>

<script src="data/questions.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
